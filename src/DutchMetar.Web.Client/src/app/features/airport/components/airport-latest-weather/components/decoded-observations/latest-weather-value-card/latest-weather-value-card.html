<div (click)="copyToClipboard()" class="outer-container" matRipple>
    @if (icon()) {
        <div class="icon-container">
            <mat-icon>{{ icon() }}</mat-icon>
        </div>
    }
    <div class="container">
        @if (label()) {
            <div class="label">{{ label() }}</div>
        }
        <div #value class="value">
            <ng-content></ng-content>
        </div>
    </div>
</div>
