<app-stack>
    <mat-card appearance="outlined">
        <mat-card-content class="toolbar">
            <form [formGroup]="form">
                <mat-form-field appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Target date</mat-label>
                    <input formControlName="selectedDate" placeholder="d/m/yyyy" [max]="maxDate" matInput [matDatepicker]="picker">
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </form>
            <button matTooltip="Reset to today" mat-icon-button><mat-icon>event_repeat</mat-icon></button>
        </mat-card-content>
    </mat-card>

    @if (airportHistory(); as history) {
        <app-stack>
            <div class="chart-section">
                <app-airport-temperature-chart [airportHistory]="history"></app-airport-temperature-chart>
                <app-airport-dewpoint-chart [airportHistory]="history"></app-airport-dewpoint-chart>
            </div>
            <div class="chart-section">
                <app-airport-visibility-chart [airportHistory]="history"></app-airport-visibility-chart>
                <app-airport-wind-speed-chart [airportHistory]="history"></app-airport-wind-speed-chart>
            </div>
        </app-stack>
    }
</app-stack>
