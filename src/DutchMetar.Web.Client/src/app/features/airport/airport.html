<app-stack>
    <app-airport-page-header
            [airport]="airportDetails()"
            [refreshDisabled]="(isRefreshDisabled$ | async) ?? true"
            (refreshClicked)="refresh()"
    ></app-airport-page-header>
    <br />
    <h2>Latest Weather</h2>
    @if (airportDetails().latestWeather) {
        <app-airport-latest-weather
                [airportDetails]="airportDetails()"
        ></app-airport-latest-weather>
    } @else {
        <p>No information about current weather available.</p>
    }
    <br/>
    <div class="historical-data-header">
        <h2>Historical Data</h2>
        <button (click)="history()" mat-button><mat-icon>history</mat-icon> View METAR/TAF history</button>
    </div>
    @if (airportIcao()) {
        <app-status-display notFoundText="No historial data found for the chosen date." loadingText="Retrieving history" [status]="historyLoadingStatus()">
            <app-airport-history-data
                    [airportHistory]="airportHistory()"
                    (dateSelected)="onHistoryDateSelected($event)"
            ></app-airport-history-data>
        </app-status-display>
    }
</app-stack>
