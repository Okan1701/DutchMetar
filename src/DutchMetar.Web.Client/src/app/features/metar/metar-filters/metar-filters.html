<mat-card appearance="outlined">
    <mat-card-content>
        <form [formRoot]="filtersForm" class="content">
            <div class="stackable">
                <mat-form-field appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Start Date</mat-label>
                    <input [formField]="filtersForm.startDate" matInput [max]="maxDate" [matDatepicker]="startPicker">
                    <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
                    <mat-datepicker #startPicker></mat-datepicker>
                </mat-form-field>
                <mat-form-field appearance="outline" subscriptSizing="dynamic">
                    <mat-label>End Date</mat-label>
                    <input [formField]="filtersForm.endDate" matInput [max]="maxDate" [matDatepicker]="endPicker">
                    <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
                    <mat-datepicker #endPicker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="center-flex">
                <button type="button" (click)="resetFilters()" [disabled]="!isFiltered()" matTooltip="Reset filters" mat-icon-button>
                    <mat-icon>settings_backup_restore</mat-icon>
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
