<app-stack>
    <button (click)="returnToAirport()" mat-button><mat-icon>arrow_back</mat-icon> Back to airport overview</button>
    <app-airport-page-header
            [airport]="airportDetails()"
            [refreshDisabled]="(isRefreshDisabled$ | async) ?? true"
            (refreshClicked)="refresh()"
    ></app-airport-page-header>

    <mat-tab-group>
        <mat-tab label="METAR">
            <ng-template matTabContent>
                <app-metar-history-tab class="tab-content" [icao]="airportIcao()" [refreshToken]="refreshToken()" (statusChanged)="setTabLoadingStatus($event)"></app-metar-history-tab>
            </ng-template>
        </mat-tab>
        <mat-tab label="TAF">
            <ng-template matTabContent>
                <app-taf-history-tab class="tab-content" [icao]="airportIcao()" [refreshToken]="refreshToken()" (statusChanged)="setTabLoadingStatus($event)"></app-taf-history-tab>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</app-stack>
