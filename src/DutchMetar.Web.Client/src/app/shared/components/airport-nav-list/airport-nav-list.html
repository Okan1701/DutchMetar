@let airportItems = airportItems$ | async;
<div>
    <mat-form-field class="search-form-field" subscriptSizing="dynamic">
        <mat-label>Search Airport</mat-label>
        <input (input)="onSearchValueChange($event)" placeholder="EHXX" matInput />
        <mat-icon matIconSuffix>search</mat-icon>
    </mat-form-field>
    @for (item of airportItems; track $index) {
        @if ($index > 1) {
            <mat-divider></mat-divider>
        }
        <app-airport-nav-list-item
            [airport]="item.airport"
            [active]="item.active"
            (click)="airportSelected.emit()"
        ></app-airport-nav-list-item>
    }
</div>
