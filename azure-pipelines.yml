name: ${{ parameters.version }}-${{ parameters.channel }}$(Build.BuildId)

trigger:
  - master

parameters:
  - name: version
    displayName: Version
    type: string
    default: 1.0.0
  - name: channel
    displayName: Release Channel
    type: string
    values:
      - dev
      - rc
      - rev
    default: dev

pool:
  vmImage: ubuntu-latest

variables:
  dotnetVersion: 10.x
  nodeVersion: 24.x
  webAppWin64ArtifactName: dutchmetar-webapp-win-x64
  databaseArtifactName: dutchmetar-db-migrations
  stubsWin64ArtifactName: dutchmetar-stubs-win-x64
  fullVersion: '${{ parameters.version }}-${{ parameters.channel }}$(Build.BuildId)'
  versionSuffixFull: '${{ parameters.channel }}$(Build.BuildId)'
  ${{ if eq(parameters.channel, 'rev') }}:
    dockerImageTag: '${{ parameters.version }}'
    dockerImageTags: |
      ${{ parameters.version }}
      latest
  ${{ else }}:
    dockerImageTag: '${{ parameters.version }}-${{ parameters.channel }}'
    dockerImageTags: '${{ parameters.version }}-${{ parameters.channel }}'

stages:
  - template: templates/build-solution-win32.yml
    parameters:
      version: ${{ parameters.version }}

  - template: templates/deploy-dev-win32.yml

  - template: templates/deploy-test-win32.yml

  - template: templates/build-docker-linux.yml
    parameters:
      version: ${{ parameters.version }}
      channel: ${{ parameters.channel }}

  - template: templates/deploy-staging-win32-linux.yml
    parameters:
      channel: ${{ parameters.channel }}

  - template: templates/deploy-production-linux.yml
    parameters:
      channel: ${{ parameters.channel }}
