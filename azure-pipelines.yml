name: ${{ parameters.version }}-${{ parameters.channel }}$(Build.BuildId)

trigger:
  - master

parameters:
  - name: version
    displayName: Version
    type: string
    default: 1.0.0
  - name: channel
    displayName: Release Channel
    type: string
    values:
      - dev
      - rc
      - rev
    default: dev

pool:
  vmImage: ubuntu-latest

variables:
  dotnetVersion: 10.x
  nodeVersion: 24.x
  webAppWin64ArtifactName: dutchmetar-webapp-win-x64
  workerSvcWin64ArtifactName: dutchmetar-worker-win-x64
  databaseArtifactName: dutchmetar-db-migrations
  stubsWin64ArtifactName: dutchmetar-stubs-win-x64
  fullVersion: '${{ parameters.version }}-${{ parameters.channel }}$(Build.BuildId)'
  versionSuffixFull: '${{ parameters.channel }}$(Build.BuildId)'
  ${{ if eq(parameters.channel, 'rev') }}:
    dockerImageTag: '${{ parameters.version }}'
    dockerImageTags: |
      ${{ parameters.version }}
      latest
  ${{ else }}:
    dockerImageTag: '${{ parameters.version }}-${{ parameters.channel }}'
    dockerImageTags: '${{ parameters.version }}-${{ parameters.channel }}'

stages:
  - template: templates/build-solution-win32.yml
    parameters:
      version: ${{ parameters.version }}

  - template: templates/deploy-iis-apps-win32.yml
    parameters:
      stageName: deploy_dev
      displayName: Deploy Dev
      environment: Dev
      variableGroup: DutchMetarDevEnv
      condition: succeeded()
      webAppsettingsFile: appsettings.webapp.dev.json
      stubAppsettingsFile: appsettings.stubservice.dev.json

  - template: templates/deploy-iis-apps-win32.yml
    parameters:
      stageName: deploy_test
      displayName: Deploy Test
      environment: Test
      variableGroup: DutchMetarTestEnv
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      webAppsettingsFile: appsettings.webapp.test.json
      stubAppsettingsFile: appsettings.stubservice.test.json

  - stage: publish_images
    displayName: Publish Docker images
    dependsOn: deploy_test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq('${{ parameters.channel }}', 'rc'), eq('${{ parameters.channel }}', 'rev')))
    jobs:
      - template: templates/build-docker-image-linux.yml
        parameters:
          jobName: publishWebImage
          displayName: Publish dutchmetar image
          repository: ultimateantic/dutchmetar
          dockerfile: '$(Build.SourcesDirectory)/src/DutchMetar.Web.Server/Dockerfile'
          version: ${{ parameters.version }}

      - template: templates/build-docker-image-linux.yml
        parameters:
          jobName: publishWorkerImage
          displayName: Publish dutchmetar-worker image
          repository: ultimateantic/dutchmetar-worker
          dockerfile: '$(Build.SourcesDirectory)/src/DutchMetar.WorkerService/Dockerfile'
          version: ${{ parameters.version }}

  - stage: deploy_staging
    displayName: Deploy Staging
    variables:
      - group: DutchMetarStagingEnv
    dependsOn: publish_images
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq('${{ parameters.channel }}', 'rc'), eq('${{ parameters.channel }}', 'rev')))
    jobs:
      - template: templates/deploy-database-win32.yml
        parameters:
          environment: Staging

      - template: templates/deploy-containers-linux.yml
        parameters:
          environment: Staging
          rollbackDisplayName: Roll back staging environment

  - stage: deploy_production
    displayName: Deploy Production
    variables:
      - group: DutchMetarProductionEnv
    dependsOn: deploy_staging
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq('${{ parameters.channel }}', 'rev'))
    jobs:
      - template: templates/deploy-database-linux.yml
        parameters:
          environment: Production

      - template: templates/deploy-containers-linux.yml
        parameters:
          environment: Production
          rollbackDisplayName: Roll back production environment
