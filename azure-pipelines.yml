name: $(fullVersion)

trigger:
  - master

parameters:
  - name: version
    displayName: Version
    type: string
    default: 0.1.0
  - name: versionSuffix
    displayName: Version Suffix
    type: string
    default: dev
  - name: deployDev
    displayName: Deploy to Dev
    type: boolean
    default: true
  - name: deployTest
    displayName: Deploy to Test
    type: boolean
    default: true

pool:
  vmImage: ubuntu-latest

variables:
  dotnetVersion: 10.x
  nodeVersion: 24.x
  webAppWin64ArtifactName: dutchmetar-webapp-win-x64
  workerSvcWin64ArtifactName: dutchmetar-worker-win-x64
  databaseArtifactName: dutchmetar-db-migrations
  fullVersion: '${{ parameters.version }}-${{ parameters.versionSuffix }}$(Build.BuildId)'
  versionSuffixFull: '${{ parameters.versionSuffix }}$(Build.BuildId)'

stages:
  - stage: build
    displayName: Build
    pool:
      vmImage: windows-latest
    jobs:
      - job: publishWebApp
        displayName: Publish web app
        variables:
          - group: GithubPackages
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
              includePreviewVersions: false

          - task: UseNode@1
            displayName: Setup Node v$(nodeVersion)
            inputs:
              version: $(nodeVersion)

          - task: PowerShell@2
            displayName: Set frontend app version
            inputs:
              targetType: 'inline'
              script: |
                $file = '$(Build.SourcesDirectory)/src/DutchMetar.Web.Client/src/environments/environment.ts'
                $content = Get-Content -Path $file -Raw
                $updated = $content.Replace('%APP_VERSION%', '$(fullVersion)')
                Set-Content -Path $file -Value $updated -NoNewline

          - template: templates/nuget-config.yml

          - task: DotNetCoreCLI@2
            displayName: Run solution tests
            inputs:
              command: 'test'
              projects: 'DutchMetar.slnx'
              testRunTitle: '.NET Tests'

          - task: DotNetCoreCLI@2
            displayName: Publish DutchMetar.Web.Server (win-x64)
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: './src/DutchMetar.Web.Server'
              arguments: '-c Release -r win-x64 -o $(Build.ArtifactStagingDirectory) /p:VersionPrefix=${{ parameters.version }} /p:VersionSuffix=$(versionSuffixFull)'
              zipAfterPublish: false
              modifyOutputPath: false

          - task: PublishBuildArtifacts@1
            displayName: Upload artifacts
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: $(webAppWin64ArtifactName)
              publishLocation: 'Container'

      - job: generateMigrations
        displayName: Generate EF migration script
        pool:
          name: emeni-build-windows
        variables:
          - group: GithubPackages
        steps:
          - task: UseDotNet@2
            displayName: Use .NET $(dotnetVersion)
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
              includePreviewVersions: false

          - task: DotNetCoreCLI@2
            displayName: Update dotnet-ef tool
            inputs:
              command: custom
              custom: 'tool'
              arguments: 'update --global dotnet-ef'

          - template: templates/nuget-config.yml

          - task: DotNetCoreCLI@2
            displayName: Restore solution
            inputs:
              command: 'restore'
              projects: 'DutchMetar.slnx'

          - task: DotNetCoreCLI@2
            displayName: Generate SQL migration script
            inputs:
              command: 'custom'
              custom: 'ef'
              arguments: 'migrations script --idempotent --output $(Build.ArtifactStagingDirectory)/dutchmetar_mssql_migrations.sql --project ./src/DutchMetar.Core/DutchMetar.Core.csproj --startup-project ./src/DutchMetar.WorkerService'

          - task: PublishBuildArtifacts@1
            displayName: Upload artifact
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/dutchmetar_mssql_migrations.sql'
              ArtifactName: $(databaseArtifactName)
              publishLocation: 'Container'

      - job: publishWorkerService
        displayName: Publish worker service
        pool:
          name: emeni-build-windows
        variables:
          - group: GithubPackages
        
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: 'sdk'
              version: $(dotnetVersion)
              includePreviewVersions: false

          - template: templates/nuget-config.yml

          - task: DotNetCoreCLI@2
            displayName: Run solution tests
            inputs:
              command: 'test'
              projects: 'DutchMetar.slnx'
              testRunTitle: '.NET Tests'

          - task: DotNetCoreCLI@2
            displayName: Publish DutchMetar.WorkerService (win-x64)
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: './src/DutchMetar.WorkerService'
              arguments: '-c Release -r win-x64 -o $(Build.ArtifactStagingDirectory) /p:VersionPrefix=${{ parameters.version }} /p:VersionSuffix=$(versionSuffixFull)'
              zipAfterPublish: false
              modifyOutputPath: false

          - task: PublishBuildArtifacts@1
            displayName: Upload artifacts
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: $(workerSvcWin64ArtifactName)
              publishLocation: 'Container'

  - stage: deploy_dev
    displayName: Deploy Dev
    condition: eq('${{ parameters.deployDev }}', 'true')
    variables:
      - group: DutchMetarDevEnv
    jobs:
      - deployment: web
        environment:
          name: Dev
          resourceType: VirtualMachine
        displayName: Deploy web app
        strategy:
          runOnce:
            deploy:
              steps:

                - task: DownloadSecureFile@1
                  displayName: Download appsettings
                  name: appsettingsFile
                  inputs:
                    secureFile: 'appsettings.webapp.dev.json'

                - task: PowerShell@2
                  displayName: Move appsettings
                  inputs:
                    targetType: 'inline'
                    script: |
                      $source = '$(appsettingsFile.secureFilePath)'
                      $targetDir = '$(Pipeline.Workspace)/$(webAppWin64ArtifactName)'
                      $dest = Join-Path $targetDir 'appsettings.Production.json'
                      Move-Item -Path $source -Destination $dest -Force

                - task: IISWebAppDeploymentOnMachineGroup@0
                  inputs:
                    WebSiteName: '$(WebAppSiteName)'
                    Package: '$(Pipeline.Workspace)/$(webAppWin64ArtifactName)'
                    RemoveAdditionalFilesFlag: true
                    TakeAppOfflineFlag: true

      - deployment: database
        environment: Dev
        pool: emeni-deploy-windows
        displayName: Deploy database
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SqlDacpacDeploymentOnMachineGroup@0
                  inputs:
                    TaskType: 'sqlQuery'
                    SqlFile: '$(Pipeline.Workspace)\$(databaseArtifactName)\dutchmetar_mssql_migrations.sql'
                    ServerName: '$(DatabaseServer)'
                    DatabaseName: '$(MainDatabaseName)'
                    AuthScheme: 'windowsAuthentication'

  - stage: deploy_test
    displayName: Deploy Test
    condition: and(succeeded(), eq('${{ parameters.deployTest }}', 'true'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: DutchMetarTestEnv
    jobs:
      - deployment: web
        environment:
          name: Test
          resourceType: VirtualMachine
        displayName: Deploy web app
        strategy:
          runOnce:
            deploy:
              steps:

                - task: DownloadSecureFile@1
                  displayName: Download appsettings
                  name: appsettingsFile
                  inputs:
                    secureFile: 'appsettings.webapp.test.json'

                - task: PowerShell@2
                  displayName: Move appsettings
                  inputs:
                    targetType: 'inline'
                    script: |
                      $source = '$(appsettingsFile.secureFilePath)'
                      $targetDir = '$(Pipeline.Workspace)/$(webAppWin64ArtifactName)'
                      $dest = Join-Path $targetDir 'appsettings.Production.json'
                      Move-Item -Path $source -Destination $dest -Force

                - task: IISWebAppDeploymentOnMachineGroup@0
                  inputs:
                    WebSiteName: '$(WebAppSiteName)'
                    Package: '$(Pipeline.Workspace)/$(webAppWin64ArtifactName)'
                    RemoveAdditionalFilesFlag: true
                    TakeAppOfflineFlag: true

      - deployment: database
        environment: Test
        pool: emeni-deploy-windows
        displayName: Deploy database
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SqlDacpacDeploymentOnMachineGroup@0
                  inputs:
                    TaskType: 'sqlQuery'
                    SqlFile: '$(Pipeline.Workspace)\$(databaseArtifactName)\dutchmetar_mssql_migrations.sql'
                    ServerName: '$(DatabaseServer)'
                    DatabaseName: '$(MainDatabaseName)'
                    AuthScheme: 'windowsAuthentication'

      - deployment: worker
        environment:
          name: Test
          resourceType: VirtualMachine
        pool: emeni-deploy-windows
        displayName: Deploy worker service
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: Stop worker service
                  inputs:
                    targetType: 'inline'
                    script: |
                      Stop-Service -Name '$(WorkerSvcWinServiceName)' -Force
                      (Get-Service -Name '$(WorkerSvcWinServiceName)').WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))

                - task: CopyFiles@2
                  displayName: Deploy worker files
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/$(workerSvcWin64ArtifactName)'
                    Contents: '**'
                    TargetFolder: '$(WorkerSvcPath)'
                    overWrite: true

                - task: DownloadSecureFile@1
                  displayName: Download worker appsettings
                  name: workerAppsettingsFile
                  inputs:
                    secureFile: 'appsettings.workerservice.test.json'

                - task: PowerShell@2
                  displayName: Move worker appsettings
                  inputs:
                    targetType: 'inline'
                    script: |
                      $source = '$(workerAppsettingsFile.secureFilePath)'
                      $dest = Join-Path '$(WorkerSvcPath)' 'appsettings.Production.json'
                      Move-Item -Path $source -Destination $dest -Force

                - task: PowerShell@2
                  displayName: Start worker service
                  inputs:
                    targetType: 'inline'
                    script: |
                      Start-Service -Name '$(WorkerSvcWinServiceName)'