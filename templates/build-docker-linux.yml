parameters:
  - name: version
    type: string
  - name: channel
    type: string

stages:
  - stage: publish_images
    displayName: Publish Docker images
    dependsOn: deploy_test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq('${{ parameters.channel }}', 'rc'), eq('${{ parameters.channel }}', 'rev')))
    jobs:
      - job: publishWebImage
        displayName: Publish dutchmetar image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build image
            inputs:
              command: build
              containerRegistry: Docker Hub
              repository: ultimateantic/dutchmetar
              Dockerfile: '$(Build.SourcesDirectory)/src/DutchMetar.Web.Server/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: $(dockerImageTags)
              arguments: '--build-arg APP_VERSION=${{ parameters.version }} --build-arg APP_VERSION_SUFFIX=$(versionSuffixFull)'

          - task: Docker@2
            displayName: Push image
            inputs:
              command: push
              containerRegistry: Docker Hub
              repository: ultimateantic/dutchmetar
              tags: $(dockerImageTags)

      - job: publishWorkerImage
        displayName: Publish dutchmetar-worker image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build image
            inputs:
              command: build
              containerRegistry: Docker Hub
              repository: ultimateantic/dutchmetar-worker
              Dockerfile: '$(Build.SourcesDirectory)/src/DutchMetar.WorkerService/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)'
              tags: $(dockerImageTags)
              arguments: '--build-arg APP_VERSION=${{ parameters.version }} --build-arg APP_VERSION_SUFFIX=$(versionSuffixFull)'

          - task: Docker@2
            displayName: Push image
            inputs:
              command: push
              containerRegistry: Docker Hub
              repository: ultimateantic/dutchmetar-worker
              tags: $(dockerImageTags)
