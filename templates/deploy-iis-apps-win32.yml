parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environment
    type: string
  - name: variableGroup
    type: string
  - name: condition
    type: string
  - name: webAppsettingsFile
    type: string
  - name: stubAppsettingsFile
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    condition: ${{ parameters.condition }}
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - deployment: web
        environment:
          name: ${{ parameters.environment }}
          resourceType: VirtualMachine
        displayName: Deploy web app
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadSecureFile@1
                  displayName: Download appsettings
                  name: appsettingsFile
                  inputs:
                    secureFile: ${{ parameters.webAppsettingsFile }}

                - task: PowerShell@2
                  displayName: Move appsettings
                  inputs:
                    targetType: 'inline'
                    script: |
                      $source = '$(appsettingsFile.secureFilePath)'
                      $targetDir = '$(Pipeline.Workspace)/$(webAppWin64ArtifactName)'
                      $dest = Join-Path $targetDir 'appsettings.Production.json'
                      Move-Item -Path $source -Destination $dest -Force

                - task: IISWebAppDeploymentOnMachineGroup@0
                  inputs:
                    WebSiteName: '$(WebAppSiteName)'
                    Package: '$(Pipeline.Workspace)/$(webAppWin64ArtifactName)'
                    RemoveAdditionalFilesFlag: true
                    TakeAppOfflineFlag: true

      - deployment: database
        environment: ${{ parameters.environment }}
        pool: emeni-deploy-windows
        displayName: Deploy database
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SqlDacpacDeploymentOnMachineGroup@0
                  inputs:
                    TaskType: 'sqlQuery'
                    SqlFile: '$(Pipeline.Workspace)\$(databaseArtifactName)\dutchmetar_mssql_migrations.sql'
                    ServerName: '$(DatabaseServer)'
                    DatabaseName: '$(MainDatabaseName)'
                    AuthScheme: 'windowsAuthentication'

      - deployment: stubs
        environment:
          name: ${{ parameters.environment }}
          resourceType: VirtualMachine
        pool: emeni-deploy-windows
        displayName: Deploy stubs service
        strategy:
          runOnce:
            deploy:
              steps:
                - task: PowerShell@2
                  displayName: Stop stub service
                  inputs:
                    targetType: 'inline'
                    script: |
                      Stop-Service -Name '$(StubsSvcWinServiceName)' -Force
                      (Get-Service -Name '$(StubsSvcWinServiceName)').WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))

                - task: CopyFiles@2
                  displayName: Deploy stub files
                  inputs:
                    SourceFolder: '$(Pipeline.Workspace)/$(stubsWin64ArtifactName)'
                    Contents: '**'
                    TargetFolder: '$(StubsSvcPath)'
                    overWrite: true

                - task: DownloadSecureFile@1
                  displayName: Download stub appsettings
                  name: workerAppsettingsFile
                  inputs:
                    secureFile: ${{ parameters.stubAppsettingsFile }}

                - task: PowerShell@2
                  displayName: Move stub appsettings
                  inputs:
                    targetType: 'inline'
                    script: |
                      $source = '$(workerAppsettingsFile.secureFilePath)'
                      $dest = Join-Path '$(StubsSvcPath)' 'appsettings.Production.json'
                      Move-Item -Path $source -Destination $dest -Force

                - task: PowerShell@2
                  displayName: Start stub service
                  inputs:
                    targetType: 'inline'
                    script: |
                      Start-Service -Name '$(StubsSvcWinServiceName)'
